<main class="flex-1 relative bg-[#17231E] flex items-center justify-center min-h-full">
  <!-- Background Image -->
  <img src="/assets/images/Arada.svg" alt="Gaming Background" class="absolute inset-0 w-full h-full object-cover z-0" />



  <!-- Social Media Icons - Left vertical for desktop -->
  <div class="absolute left-2 sm:left-4 top-[35%] sm:top-[45%] flex flex-col space-y-3 z-10 hidden sm:flex">
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/facebook.svg" alt="Facebook" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/instagram.svg" alt="Instagram" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/x.svg" alt="X" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/youtube.svg" alt="YouTube" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/telegram.svg" alt="Telegram" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
  </div>

  <!-- Sign In Box -->
  <div class="container mx-auto px-4 relative z-10 flex justify-center md:justify-end mt-[120px]">
    <div
      class="w-full max-w-sm md:max-w-md bg-white bg-opacity-20 backdrop-blur-md rounded-2xl p-5 sm:p-6 md:p-8 lg:p-10 shadow-lg">
      <h2 class="text-3xl font-bold text-white mb-4 sm:mb-6 text-center">Sign in</h2>
      
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-500 bg-opacity-20 border border-red-500 rounded-lg text-red-100 text-sm text-center">
        {{ errorMessage }}
      </div>

      <form class="space-y-5 sm:space-y-6" (ngSubmit)="onLogin()">
        <!-- Username -->
        <div>
          <input type="text" placeholder="User name" name="user_id" [(ngModel)]="credentials.user_id" required
            class="w-full h-[42px] px-4  border border-[#CDCDCD] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#374842] text-gray-800 bg-[#FFF9F0]">
        </div>

        <!-- Password -->
        <div>
          <input type="password" placeholder="Password" name="password" [(ngModel)]="credentials.password" required
            class="w-full h-[42px] px-4  border border-[#CDCDCD] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#374842] text-gray-800 bg-[#FFF9F0]">
        </div>

        <!-- Remind me + Forget password -->
        <div class="flex items-center justify-between mt-2">
          <div class="flex items-center space-x-2">
            <input type="checkbox" id="remind" class="h-4 w-4 text-[#374842] rounded focus:ring-0">
            <label for="remind" class="text-gray-700 text-sm">Remind me</label>
          </div>
          <a routerLink="/auth/forgot-password" class="text-sm text-gray-700 hover:underline">Forget Password?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" [disabled]="loading"
          class="w-full py-3 bg-[#2E3E38] text-white rounded-lg font-semibold hover:bg-[#2e3b36] transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
          {{ loading ? 'Logging in...' : 'Log in' }}
        </button>

        <!-- Sign Up Link -->
        <p class="text-center text-sm text-gray-700 mt-4">
          Don't have an account?
          <a href="#" class="text-[#2E3E38] font-semibold hover:underline">Sign up here</a>
        </p>
      </form>
    </div>
  </div>
</main>
