<main class="flex-1 relative bg-secondary font-exo flex flex-col min-h-screen pt-24 pb-12">
  <!-- Subtle Grid Background -->
  <div class="absolute inset-0 z-0 opacity-[0.03]" 
       style="background-image: linear-gradient(#A3E635 1px, transparent 1px), linear-gradient(90deg, #A3E635 1px, transparent 1px); background-size: 50px 50px;">
  </div>

  <div class="container mx-auto px-6 md:px-12 relative z-10 flex-grow flex flex-col items-center justify-center">
    
    <div class="w-full max-w-md bg-forest-light/20 backdrop-blur-3xl border border-white/10 rounded-3xl p-8 md:p-10 shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative overflow-hidden group">
      
      <!-- Ambient glow -->
      <div class="absolute -top-32 -right-32 w-80 h-80 bg-primary/10 rounded-full blur-[100px] pointer-events-none group-hover:bg-primary/20 transition-all duration-1000"></div>

      <div class="relative z-10 text-center mb-8">
        <h2 class="text-3xl font-rajdhani font-black text-white uppercase tracking-tighter mb-1">
          Recover <span class="text-primary italic">Access</span>
        </h2>
        <p class="text-gray-500 text-[10px] font-medium tracking-widest uppercase">Lost your security key?</p>
      </div>

      <div class="space-y-6 relative z-10">
        <div class="space-y-1.5 text-left">
          <label class="block text-primary text-[10px] font-bold uppercase tracking-[0.2em] ml-1 opacity-80">Access ID</label>
          <input type="text"
            class="w-full bg-secondary/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder:text-gray-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all font-exo"
            placeholder="Enter your phone number">
        </div>

        <button routerLink="/auth/new-pin"
          class="w-full py-3 bg-primary text-secondary font-rajdhani font-extrabold text-sm uppercase tracking-[0.15em] rounded-xl hover:bg-accent hover:-translate-y-0.5 transition-all duration-300 shadow-xl active:translate-y-0">
          Transmit OTP
        </button>
      </div>

      <div class="relative z-10 mt-6 text-center">
        <a routerLink="/landing" class="text-gray-500 hover:text-primary transition-colors text-[10px] font-bold uppercase tracking-wider">
          < Return to Base
        </a>
      </div>

    </div>
  </div>
</main>
