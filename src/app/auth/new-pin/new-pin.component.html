<main class="flex-1 relative bg-[#17231E] flex items-center justify-center min-h-full">
  <!-- Background Image -->
  <img src="/assets/images/gamebg.svg" alt="Gaming Background" class="absolute inset-0 w-full h-auto object-cover z-0" />

  <!-- Social Media Icons - Left vertical for desktop -->
  <div class="absolute left-2 sm:left-4 top-[35%] sm:top-[45%] flex flex-col space-y-3 z-10 hidden sm:flex">
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/facebook.svg" alt="Facebook" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/instagram.svg" alt="Instagram" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/x.svg" alt="X" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/YoutubeLogo.svg" alt="YouTube" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
    <a href="#" class="transform transition-transform duration-300 hover:scale-110">
      <img src="/assets/icons/TelegramLogo.svg" alt="Telegram" class="w-6 sm:w-8 h-6 sm:h-8">
    </a>
  </div>

  <!-- Sign In Box -->
  <div class="container mx-auto px-4 relative z-10 flex justify-center mt-[100px]">
    <div class="w-full max-w-sm md:max-w-md bg-white bg-opacity-20 backdrop-blur-md rounded-2xl p-5 sm:p-6 md:p-8 lg:p-10 shadow-lg">
      <h2 class="text-3xl font-bold text-white mb-4 sm:mb-6 text-center">
        Verification
      </h2>
      <div class="mb-6 flex justify-center space-x-2">
        <input type="text" class="w-[40px] h-[40px] border border-[#CDCDCD] rounded-lg text-center bg-[#FFF9F0]" maxlength="1" />
        <input type="text" class="w-[40px] h-[40px] border border-[#CDCDCD] rounded-lg text-center bg-[#FFF9F0]" maxlength="1" />
        <input type="text" class="w-[40px] h-[40px] border border-[#CDCDCD] rounded-lg text-center bg-[#FFF9F0]" maxlength="1" />
        <input type="text" class="w-[40px] h-[40px] border border-[#CDCDCD] rounded-lg text-center bg-[#FFF9F0]" maxlength="1" />
        <input type="text" class="w-[40px] h-[40px] border border-[#CDCDCD] rounded-lg text-center bg-[#FFF9F0]" maxlength="1" />
      </div>
      <div class="mb-6 text-center text-white">
        01:00
      </div>
      <div class="mb-6 text-center text-white">
        Verification Code Will Be Sent in 60 Seconds
      </div>
      <div class="flex justify-center">
        <button
          class="w-full py-3 bg-[#2E3E38] text-white rounded-lg font-semibold hover:bg-[#2e3b36] transition-colors duration-300"
        >
          Verify
        </button>
      </div>
    </div>
  </div>
</main>
