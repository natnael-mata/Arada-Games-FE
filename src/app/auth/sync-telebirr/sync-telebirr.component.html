<div class="min-h-screen flex flex-col lg:flex-row relative">
  <!-- First Section with Centered Text -->
  <div
    class="flex-1 lg:flex-none lg:w-1/2 bg-primary rounded-bl-[16px] rounded-br-[16px] lg:rounded-bl-[0px] lg:rounded-tr-[16px] lg:rounded-br-[16px] relative overflow-hidden flex items-center justify-center"
  >
    <!-- Top-left icon -->
    <img
      src="../../../assets/icons/money.svg"
      alt="Decorative icon"
      class="absolute w-48 h-48 lg:w-72 lg:h-72"
      style="top: 15%; left: 10%; transform: translate(-50%, -50%)"
    />

    <!-- Centered Text -->
    <div class="text-center z-0 px-4 -mt-20 lg:mt-0 lg:-ml-10">
      <h2 class="text-4xl lg:text-5xl font-bold text-secondary mb-4">
        Budget wise
      </h2>
    </div>
  </div>

  <!-- Second Section with Centered Text -->
  <div
    class="flex-1 lg:flex-none lg:w-1/2 bg-white relative overflow-hidden flex items-center justify-center"
  >
    <!-- Bottom-right icon -->
    <img
      src="../../../assets/icons/money-white.svg"
      alt="Decorative icon"
      class="absolute w-48 h-48 lg:w-72 lg:h-72"
      style="bottom: 15%; right: 10%; transform: translate(50%, 50%)"
    />

    <!-- Centered Text (Visible only on lg screens and above) -->
    <div class="hidden lg:block text-center z-0 px-4">
      <p class="text-3xl text-secondary font-medium">
        Your finance, At your Fingertips
      </p>
    </div>
  </div>

  <!-- Centered Login Div (Overlay) -->
  <div
    class="fixed inset-0 flex items-center justify-center z-10 shadow-md border border-gray-200 px-4"
  >
    <div
      class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md flex flex-col items-center"
    >
      <!-- Centered Image -->
      <img
        src="../../../assets/icons/telebirr.svg"
        alt="Forgot PIN illustration"
        class="w-32 h-32 mb-8"
      />

      <!-- Primary Button -->
      <button
        class="w-full bg-primary text-Dark text-base py-3 px-4 rounded-lg mb-4 font-semibold hover:bg-primary-dark transition-colors"
      >
        Sync with telebirr account
      </button>

      <!-- Secondary Button (White BG) -->
      <button
        class="w-full bg-white text-black py-3 px-4 rounded-lg border border-gray font-semibold hover:bg-gray-50 transition-colors"
      >
        Skip
      </button>
    </div>
  </div>
</div>
