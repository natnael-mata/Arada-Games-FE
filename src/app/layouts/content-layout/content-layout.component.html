<div class="flex min-h-screen bg-secondary">
  <!-- Main Content Wrapper -->
  <div class="flex flex-col flex-1 w-full transition-all duration-500 relative min-h-screen">
    <!-- Top Navbar Wrapper (Transparent to let component handle it) -->
    <header class="sticky top-0 z-40 bg-transparent">
      <app-navbar></app-navbar>
    </header>

    <!-- Content & Footer -->
    <main class="flex flex-col flex-1 m-0 p-0">
      <!-- Page Content -->
      <section class="flex-1 m-0 p-0 relative overflow-hidden">
        <div [@routeAnimations]="prepareRoute(routerOutlet)" class="h-full">
          <router-outlet #routerOutlet="outlet"></router-outlet>
        </div>
      </section>

      <!-- Footer -->
      <footer class="m-0 p-0 border-t border-white/5">
        <app-footer></app-footer>
      </footer>
    </main>
  </div>
</div>
