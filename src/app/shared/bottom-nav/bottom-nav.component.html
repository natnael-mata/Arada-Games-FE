<div
  class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 md:hidden"
>
  <nav class="flex justify-around items-center py-2 px-4 max-w-md mx-auto">
    <button
      *ngFor="let item of navItems"
      (click)="onTabClick(item)"
      class="flex flex-col items-center justify-center min-w-0 flex-1 py-2 px-1"
      [class.text-lime-600]="activeTab === item.id"
      [class.text-gray-500]="activeTab !== item.id"
    >
      <img
        [src]="item.icon"
        [alt]="item.label"
        class="h-5 w-5 mb-1"
        [class.filter]="
          activeTab === item.id
            ? 'brightness-0 saturate-100 hue-rotate-90deg'
            : ''
        "
      />
      <span class="text-xs font-medium truncate">{{ item.label }}</span>
    </button>
  </nav>
</div>
