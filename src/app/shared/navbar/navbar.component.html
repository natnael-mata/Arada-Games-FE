<nav
  class="fixed top-0 left-0 right-0 z-50 py-4 px-6 md:px-12 flex justify-between items-center font-inter bg-[#17231E]">
  <!-- Logo -->
  <div class="flex-shrink-0 flex items-center mr-6">
    <img src="/assets/logo/logo.svg" alt="Araidas Games" class="h-10 w-auto" />
  </div>

  <!-- Navigation Links (Scrollable on mobile) -->
  <div class="flex-grow overflow-x-auto no-scrollbar mx-4">
    <ul class="flex items-center space-x-6 whitespace-nowrap text-white text-sm md:text-base">
      <li><a routerLink="/" class="hover:text-[#A8B4B0] transition-colors duration-300">Home</a></li>
      <li><a routerLink="/landing/how-it-work" class="hover:text-[#A8B4B0] transition-colors duration-300">How It
          Works</a></li>
      <li><a routerLink="/landing/about-us" class="hover:text-[#A8B4B0] transition-colors duration-300">About Us</a>
      </li>
      <li><a routerLink="/landing/faq" class="hover:text-[#A8B4B0] transition-colors duration-300">FAQ</a></li>
      <li><a routerLink="/landing/contact-us" class="hover:text-[#A8B4B0] transition-colors duration-300">Contact</a>
      </li>
    </ul>
  </div>

  <!-- Right-side Utilities (Language & Logout) -->
  <div class="flex-shrink-0 flex items-center space-x-4">
    <!-- Language Selector -->
    <select [(ngModel)]="selectedLang" (change)="onLanguageChange($event)"
      class="bg-transparent text-white border border-white px-2 py-1 rounded-lg cursor-pointer hover:border-[#A8B4B0] focus:outline-none text-sm">
      <option value="en" class="text-black">EN</option>
      <option value="am" class="text-black">AM</option>
    </select>

    <!-- Profile & Logout (Conditional) -->
    <ng-container *ngIf="isLoggedIn">
      <!-- Profile -->
      <a routerLink="/landing/profile"
        class="flex items-center space-x-2 text-white hover:text-[#A8B4B0] transition-colors duration-300 group cursor-pointer">
        <img src="/assets/icons/user.svg" alt="Profile" class="h-5 w-5 filter invert group-hover:brightness-75" />
        <span class="hidden sm:inline">Profile</span>
      </a>

      <!-- Logout -->
      <a (click)="logout()"
        class="flex items-center space-x-2 text-white hover:text-[#A8B4B0] transition-colors duration-300 group cursor-pointer">
        <img src="/assets/icons/logout.svg" alt="Logout" class="h-5 w-5 filter invert group-hover:brightness-75" />
        <span class="hidden sm:inline">Logout</span>
      </a>
    </ng-container>
  </div>
</nav>
