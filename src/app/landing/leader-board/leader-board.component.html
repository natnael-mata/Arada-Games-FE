<main class="flex-1 relative bg-[#17231E] flex items-center justify-center min-h-full">
  <!-- Background Image -->
  <img src="/assets/images/Arada2.svg" alt="Gaming Background"
       class="absolute inset-0 w-full h-auto object-cover z-0" />

  <!-- Social Icons -->
  <div class="fixed left-4 top-1/2 transform -translate-y-1/2 z-10 hidden sm:flex flex-col space-y-4">
    <a href="#"><img src="/assets/icons/facebook.svg" class="w-6 h-6 sm:w-7 sm:h-7" /></a>
    <a href="#"><img src="/assets/icons/instagram.svg" class="w-6 h-6 sm:w-7 sm:h-7" /></a>
    <a href="#"><img src="/assets/icons/x.svg" class="w-6 h-6 sm:w-7 sm:h-7" /></a>
    <a href="#"><img src="/assets/icons/YoutubeLogo.svg" class="w-6 h-6 sm:w-7 sm:h-7" /></a>
    <a href="#"><img src="/assets/icons/TelegramLogo.svg" class="w-6 h-6 sm:w-7 sm:h-7" /></a>
  </div>

  <!-- Outer Container -->
  <div class="w-full max-w-[600px] px-3 sm:px-4 relative z-10">
    <div class="bg-white bg-opacity-20 backdrop-blur-md rounded-3xl p-4 sm:p-6 shadow-lg">

      <!-- Header -->
      <div class="flex items-center justify-center mb-4">
        <img src="/assets/icons/crown.svg" alt="crown" class="w-5 h-5 mr-2">
        <h1 class="text-base sm:text-lg font-bold text-white">Total leaderboard</h1>
      </div>

      <!-- Inner Table -->
      <div class="bg-[#FFF9F0] p-3 sm:p-4 mx-auto w-full rounded-2xl">

        <!-- Tabs -->
        <div class="flex border border-gray-300 rounded-lg overflow-hidden mb-4 text-xs sm:text-sm">
          <button
            *ngFor="let tab of ['Daily','Weekly','Monthly','All time']"
            (click)="changeTab(tab)"
            class="flex-1 py-2 sm:py-2.5 font-medium transition"
            [ngClass]="{
              'bg-[#2E3E38] text-white rounded-lg': activeTab === tab,
              'text-gray-700 hover:bg-gray-100': activeTab !== tab
            }">
            {{tab}}
          </button>
        </div>

        <!-- Values -->
        <div class="bg-[#FFF9F0] rounded-2xl border overflow-hidden text-xs sm:text-sm">
          <div *ngFor="let entry of displayedData; let i = index"
               class="flex justify-between items-center px-2 sm:px-3 py-2 text-gray-800 border-b last:border-b-0">
            <span>{{(currentPage - 1) * pageSize + i + 1}}. {{entry.name}}</span>
            <span>{{entry.points}} pt</span>
          </div>
        </div>

        <!-- Pagination -->
        <div class="flex justify-center mt-4 space-x-2">
          <!-- Previous -->
          <button
            (click)="goToPage(currentPage - 1)"
            [disabled]="currentPage === 1"
            class="w-10 h-10 flex items-center justify-center rounded border disabled:opacity-30 hover:text-[#2E3E38]">
            <span class="text-lg font-bold">&lt;</span>
          </button>

          <!-- Page Numbers + Ellipsis -->
          <ng-container *ngFor="let page of paginationRange">
            <button *ngIf="page !== '...'; else dots"
              (click)="goToPage(page)"
              class="w-10 h-10 flex items-center justify-center rounded font-semibold transition"
              [ngClass]="{
                'bg-[#2E3E38] text-white': currentPage === page,
                'bg-transparent text-gray-700 hover:bg-gray-200': currentPage !== page
              }">
              {{page}}
            </button>
            <ng-template #dots>
              <div class="w-10 h-10 flex items-center justify-center text-gray-500">...</div>
            </ng-template>
          </ng-container>

          <!-- Next -->
          <button
            (click)="goToPage(currentPage + 1)"
            [disabled]="currentPage === totalPages"
            class="w-10 h-10 flex items-center justify-center rounded border disabled:opacity-30 hover:text-[#2E3E38]">
            <span class="text-lg font-bold">&gt;</span>
          </button>
        </div>

      </div>
    </div>
  </div>
</main>
