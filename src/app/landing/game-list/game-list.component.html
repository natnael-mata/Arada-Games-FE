<main class="flex-1 relative bg-[#17231E] flex items-center justify-center min-h-full">
  <!-- Background Image -->
  <img src="/assets/images/Arada.svg" alt="Gaming Background" class="absolute inset-0 w-full h-full object-cover z-0" />
  <div class="container mx-auto px-4 relative z-10 py-6 bg-white/20 backdrop-blur-md rounded-2xl mt-6 sm:mt-0">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-white">Game list</h1>
      <button routerLink="/landing/leaderboard"
              class="text-white font-semibold bg-transparent px-4 py-2 rounded-lg flex items-center border border-white hover:bg-white hover:text-black transition">
        <img src="assets/icons/crown.svg" alt="Crown" class="w-5 h-5 mr-2" />
        Master leaderboard
      </button>
    </div>

    <div *ngIf="loading" class="rounded-2xl bg-white/15 text-white px-6 py-10 text-center">
      Loading games...
    </div>

    <div *ngIf="errorMessage" class="rounded-2xl bg-red-500/20 text-white px-6 py-10 text-center">
      {{ errorMessage }}
    </div>

    <!-- Slider Container -->
    <div *ngIf="!loading && !errorMessage" class="relative flex items-center justify-center">

      <!-- Slider -->
      <div #gameSlider
           class="flex gap-6 overflow-x-auto snap-x snap-mandatory scroll-smooth justify-start
                  [-ms-overflow-style:'none'] [scrollbar-width:'none'] [&::-webkit-scrollbar]:hidden 
                  max-w-[960px] w-full px-4">
        
        <div *ngFor="let game of games"
             class="flex-none w-[300px] h-[400px] snap-start rounded-3xl overflow-hidden shadow-lg relative border-0"
             [style.background-image]="'url(' + game.image + ')'"
             style="background-size: cover; background-position: center;">
          
          <!-- Gradient Overlay -->
          <div class="absolute inset-0 rounded-3xl bg-gradient-to-t from-black/90 via-black/60 to-transparent"></div>

          <!-- Card Content -->
          <div class="relative z-10 flex flex-col h-full justify-between p-4">
            <div class="flex justify-between items-start">
              <div class="bg-white/80 rounded-full p-2 shadow">
                <img src="assets/icons/building.svg" alt="icon" class="w-5 h-5" />
              </div>
              <button class="bg-white/90 rounded-full px-2 sm:px-3 py-1 text-xs flex items-center gap-1 shadow hover:bg-white transition">
                <span class="text-gray-800 font-bold">?</span>
                <span class="text-gray-800 font-medium">How to play</span>
              </button>
            </div>
            <div class="text-center">
              <h3 class="text-base sm:text-lg font-semibold text-white mb-2">{{ game.name }}</h3>
              <p class="text-white text-xs sm:text-sm flex justify-center items-center gap-2 sm:gap-3 mb-2">
                <img src="assets/icons/multiplayer.svg" class="w-4 sm:w-5 h-4 sm:h-5"> {{ game.modeLabel }}
                <img src="assets/icons/players.svg" class="w-3 sm:w-4 h-3 sm:h-4"> {{ game.playerCountLabel }}
              </p>
              <div class="flex justify-center mb-3">
                <img *ngFor="let star of stars | slice:0:game.rating" src="assets/icons/star.svg" class="w-3 sm:w-4 h-3 sm:h-4" />
              </div>
              <button [routerLink]="game.route"
        class="w-full py-1 sm:py-2 text-white font-semibold rounded-lg border border-white hover:bg-white hover:text-black transition text-xs sm:text-base">
  Play
</button>

            </div>
          </div>
        </div>
      </div>

      <!-- Left Arrow -->
      <button (click)="scrollLeft()"
              [class.opacity-40]="currentIndex === 0"
              [class.pointer-events-none]="currentIndex === 0"
              class="absolute left-4 top-1/2 -translate-y-1/2 z-20 w-10 h-10 flex items-center justify-center text-white rounded-full bg-white/20 backdrop-blur-md hover:bg-white/30 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Right Arrow -->
      <button (click)="scrollRight()"
              [class.opacity-40]="currentIndex === maxIndex"
              [class.pointer-events-none]="currentIndex === maxIndex"
              class="absolute right-4 top-1/2 -translate-y-1/2 z-20 w-10 h-10 flex items-center justify-center text-white rounded-full bg-white/20 backdrop-blur-md hover:bg-white/30 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>

    </div>
  </div>
</main>
