<main class="flex-1 relative bg-[#17231E] flex items-center justify-center min-h-full">
  <!-- Background Image -->
  <img src="/assets/images/Arada.svg" alt="Gaming Background" class="absolute inset-0 w-full h-full object-cover z-0" />

  <!-- Social Media Icons -->
  <div class="absolute left-2 sm:left-4 top-[35%] sm:top-[45%] flex flex-col space-y-3 z-10 hidden sm:flex">
    <a href="#"><img src="/assets/icons/facebook.svg" class="w-6 sm:w-8 h-6 sm:h-8"></a>
    <a href="#"><img src="/assets/icons/instagram.svg" class="w-6 sm:w-8 h-6 sm:h-8"></a>
    <a href="#"><img src="/assets/icons/x.svg" class="w-6 sm:w-8 h-6 sm:h-8"></a>
    <a href="#"><img src="/assets/icons/youtube.svg" class="w-6 sm:w-8 h-6 sm:h-8"></a>
    <a href="#"><img src="/assets/icons/telegram.svg" class="w-6 sm:w-8 h-6 sm:h-8"></a>
  </div>

  <!-- Sign In Box -->
  <div class="container mx-auto px-4 relative z-10 flex justify-center md:justify-end mt-[120px]">
    <div
      class="w-full max-w-sm md:max-w-md bg-white bg-opacity-20 backdrop-blur-md rounded-2xl p-5 sm:p-6 md:p-8 lg:p-10 shadow-lg">
      <h2 class="text-3xl font-bold text-white mb-4 sm:mb-6 text-center">Sign in</h2>
      <form class="space-y-5 sm:space-y-6">

        <!-- Username -->
        <div>
          <input type="text" placeholder="User name"
            class="w-full h-[42px] px-4 border border-[#CDCDCD] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#18281E] text-gray-800 bg-[#FFF9F0]">
        </div>

        <!-- Password -->
        <div>
          <input type="password" placeholder="Password"
            class="w-full h-[42px] px-4 border border-[#CDCDCD] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#18281E] text-gray-800 bg-[#FFF9F0]">
        </div>

        <!-- Remember & Forgot -->
        <div class="flex items-center justify-between mt-2">
          <div class="flex items-center space-x-2">
            <input type="checkbox" id="remind" class="h-4 w-4 text-[#18281E] rounded focus:ring-[#18281E]">
            <label for="remind" class="text-gray-700 text-sm">Remind me</label>
          </div>
          <a routerLink="/auth/forgot-password" class="text-sm text-[#18281E] hover:underline">Forget Password?</a>
        </div>

        <!-- Login button -->
        <button type="button" (click)="onLogin()"
          class="w-full py-3 bg-[#18281E] text-white rounded-lg font-semibold hover:bg-[#0f1a14] transition-colors duration-300">
          Log in
        </button>

        <!-- Subscribe Section -->
        <div class="text-center text-sm text-gray-700 mt-4">
          <p class="mb-3">Haven't subscribed yet? Subscribe here</p>
          <a href="https://cg.onevas.et/subscribe/176" target="_blank"
            class="block w-full py-3 border-2 border-[#18281E] text-[#18281E] rounded-lg text-lg font-bold text-center hover:bg-[#18281E] hover:text-white transition-colors duration-300">
            Subscribe
          </a>
        </div>
      </form>
    </div>
  </div>
</main>

<!-- Subscribe Modal with iframe -->
<div *ngIf="isSubscribeModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl w-[90%] max-w-4xl h-[80%] shadow-lg relative flex flex-col">

    <!-- Close Button -->
    <button (click)="closeSubscribeModal()"
      class="absolute top-2 right-2 text-gray-500 hover:text-black text-lg font-bold z-10">
      ✕
    </button>

    <!-- Iframe -->
    <iframe src="https://cg.onevas.et/subscribe/176" class="w-full h-full rounded-b-xl border-0" loading="lazy">
    </iframe>
  </div>
</div>
