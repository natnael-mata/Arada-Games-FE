<section class="py-12 px-6 sm:px-10 md:px-20 bg-white">
  <h2
    class="text-center text-[#270E0F] font-montserrat font-semibold text-3xl sm:text-4xl md:text-[36px] leading-tight tracking-normal mb-12"
  >
    Why Budgetwise?
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-10 max-w-7xl mx-auto">
    <div
      *ngFor="let feature of features"
      class="flex flex-col items-center text-center p-6   hover:shadow-lg transition-shadow duration-300"
    >
      <img
        [src]="feature.image"
        [alt]="feature.title"
        class="w-24 h-24 sm:w-32 sm:h-32 object-contain mb-6"
      />

      <p
        class="font-montserrat font-semibold text-xl sm:text-2xl text-[#1E2810] leading-tight tracking-wide mb-3"
      >
        {{ feature.title }}
      </p>

      <p
class="text-[#424F30] text-center font-open-sans text-[18px] font-normal leading-none tracking-[0.018px]"
      >
        {{ feature.description }}
      </p>
    </div>
  </div>
</section>


<section class="bg-[#F3FFE399] px-4 py-16 md:py-24">
  <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 text-center">

    <!-- 1. Users -->
    <div>
      <h3 class="text-[#424F30] text-center font-open-sans text-[24px] font-normal leading-none tracking-[0.024px]">
        Users
      </h3>
      <div class="flex justify-center items-center gap-2 mt-[16px]">
        <p class="text-[#1E2810] font-montserrat text-[48px] font-semibold leading-none">10,000</p>
        <img src="assets/images/Plus.svg" alt="Plus Icon" class="object-cover" />
      </div>
    </div>

    <!-- 2. Success Rate -->
    <div>
      <h3 class="text-[#424F30] text-center font-open-sans text-[24px] font-normal leading-none tracking-[0.024px]">
        Success Rate
      </h3>
      <div class="flex justify-center items-center gap-2 mt-[16px]">
        <p class="text-[#1E2810] font-montserrat text-[48px] font-semibold leading-none">95</p>
        <img src="assets/images/Percent.svg" alt="Check Icon" class="object-cover" />
      </div>
    </div>

    <!-- 3. Years in Business -->
    <div>
      <h3 class="text-[#424F30] text-center font-open-sans text-[24px] font-normal leading-none tracking-[0.024px]">
        Years in Business
      </h3>
      <div class="flex justify-center items-center gap-2 mt-[16px]">
        <p class="text-[#1E2810] font-montserrat text-[48px] font-semibold leading-none">95%</p>
        <img src="assets/images/CalendarDots.svg" alt="Check Icon" class="object-cover" />
      </div>    </div>

  </div>
</section>
