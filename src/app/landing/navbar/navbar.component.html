<!-- Navbar -->
<nav class="flex items-center justify-between px-4 md:px-10 lg:px-14 py-4 relative z-50 bg-secondary shadow-md border-b border-white/5">
  <!-- Logo -->
  <div class="flex items-center space-x-3 cursor-pointer" routerLink="/">
    <img src="/assets/images/logo.svg" alt="Logo" class="h-10 w-10 rounded-full border border-primary/30" />
    <span class="text-white font-rajdhani text-2xl font-black uppercase tracking-widest">
      Arada <span class="text-primary italic">Games</span>
    </span>
  </div>

  <!-- Hamburger (mobile only) -->
  <div class="md:hidden">
    <button (click)="toggleDrawer()" class="text-white hover:text-primary transition-colors focus:outline-none">
      <svg class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- Desktop Links -->
  <div class="hidden md:flex items-center space-x-8">
    <a href="#hero" class="text-gray-300 hover:text-primary font-rajdhani text-sm font-bold uppercase tracking-widest transition-colors">Home</a>
    <a href="#gamelist" class="text-gray-300 hover:text-primary font-rajdhani text-sm font-bold uppercase tracking-widest transition-colors">Modules</a>
    <a href="#whoweare" class="text-gray-300 hover:text-primary font-rajdhani text-sm font-bold uppercase tracking-widest transition-colors">About Us</a>
    <a href="#howitworks" class="text-gray-300 hover:text-primary font-rajdhani text-sm font-bold uppercase tracking-widest transition-colors">How it Works</a>
  </div>

  <!-- Desktop Register Button -->
  <div class="hidden md:flex">
    <a href="https://cg.onevas.et/subscribe/176" target="_blank" class="flex h-10 px-6 py-2 justify-center items-center rounded-xl bg-primary text-secondary font-rajdhani text-sm font-black uppercase tracking-widest hover:bg-accent hover:-translate-y-0.5 transition-all duration-300 shadow-xl">
      Subscribe
    </a>
  </div>
</nav>

<!-- Mobile Drawer -->
<div *ngIf="isDrawerOpen" class="fixed inset-0 bg-secondary/95 backdrop-blur-3xl z-50 flex flex-col px-6 py-8 animate-slide-in-right md:hidden shadow-2xl border-l border-white/5">
  <!-- Close Button -->
  <div class="flex justify-end mb-10">
    <button (click)="closeDrawer()" class="text-white hover:text-primary transition-colors focus:outline-none">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Mobile Nav Links -->
  <nav class="flex flex-col space-y-6 text-left pl-4">
    <a href="#hero" class="text-gray-300 hover:text-primary font-rajdhani text-xl font-bold uppercase tracking-widest transition-colors" (click)="closeDrawer()">Home</a>
    <a href="#gamelist" class="text-gray-300 hover:text-primary font-rajdhani text-xl font-bold uppercase tracking-widest transition-colors" (click)="closeDrawer()">Modules</a>
    <a href="#whoweare" class="text-gray-300 hover:text-primary font-rajdhani text-xl font-bold uppercase tracking-widest transition-colors" (click)="closeDrawer()">About Us</a>
    <a href="#howitworks" class="text-gray-300 hover:text-primary font-rajdhani text-xl font-bold uppercase tracking-widest transition-colors" (click)="closeDrawer()">How it Works</a>
  </nav>

  <!-- Mobile Register Button -->
  <a href="https://cg.onevas.et/subscribe/176" target="_blank" class="mt-12 w-full text-center py-4 rounded-xl bg-primary text-secondary font-rajdhani text-lg font-black uppercase tracking-widest hover:bg-accent transition-all duration-300 shadow-xl" (click)="closeDrawer()">
    Subscribe
  </a>
</div>
